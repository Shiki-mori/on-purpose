<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>日志</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="logs.css">
  </head>
  <body>
    <main>
      <h1 id="logs-title"></h1>
      <section id="stats" hidden>
        <h2 id="stats-heading"></h2>
        <div class="ranges">
          <button id="range-month" type="button" aria-pressed="true"></button>
          <button id="range-recent" type="button" aria-pressed="false"></button>
        </div>
        <h3 id="top-purpose-label"></h3>
        <div id="top-purpose-names" class="stat-names"></div>
        <h3 id="top-interrupt-label"></h3>
        <div id="top-interrupt-names" class="stat-names"></div>
        <figure class="pie-block">
          <figcaption id="pie-caption"></figcaption>
          <div class="pie-layout">
            <div id="pie"></div>
            <ul id="pie-legend"></ul>
          </div>
        </figure>
      </section>
      <h2 id="records-heading"></h2>
      <ul id="records"></ul>
      <p id="error" hidden></p>
    </main>
    <script src="../shared/constants.js"></script>
    <script src="logs.js"></script>
  </body>
</html>
