<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>有目的</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <section>
        <h2>间隔</h2>
        <div class="interval">
          <label id="first-label" for="first-minutes"></label>
          <input id="first-minutes" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
          <p id="first-error" class="row-error" hidden></p>
        </div>
        <div class="interval">
          <label id="again-label" for="again-minutes"></label>
          <input id="again-minutes" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
          <p id="again-error" class="row-error" hidden></p>
        </div>
      </section>
      <section>
        <h2>目的</h2>
        <ul id="purposes"></ul>
      </section>
      <section>
        <h2>打断选项</h2>
        <form id="option-form">
          <label id="option-add-label" for="option-name">添加打断选项</label>
          <div class="option-add">
            <input id="option-name" type="text" autocomplete="off">
            <button type="submit">添加</button>
          </div>
          <p id="option-add-error" class="row-error" hidden></p>
        </form>
        <ul id="options"></ul>
      </section>
      <section>
        <h2>记录</h2>
        <ul id="records"></ul>
      </section>
      <p id="error" hidden></p>
    </main>
    <script src="../shared/constants.js"></script>
    <script src="../shared/time.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
