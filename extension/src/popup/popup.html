<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>On Purpose</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <section aria-labelledby="block-heading">
        <h2 id="block-heading"></h2>
        <form id="block-form">
          <fieldset id="block-fields" disabled>
            <label class="block-toggle"><input id="block-enabled" type="checkbox"><span id="block-enable-label"></span></label>
            <div class="block-times">
              <label><span id="block-start-label"></span><input id="block-start" type="time" step="60" required></label>
              <label><span id="block-end-label"></span><input id="block-end" type="time" step="60" required></label>
            </div>
            <p id="block-hint" class="hint"></p>
            <button id="block-save" type="submit" class="primary"></button>
          </fieldset>
          <p id="block-status" class="hint" role="status"></p>
          <p id="block-error" class="row-error" role="alert" hidden></p>
        </form>
      </section>
      <section>
        <h2>间隔</h2>
        <div class="interval">
          <label id="first-label" for="first-minutes"></label>
          <input id="first-minutes" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
          <p id="first-error" class="row-error" hidden></p>
        </div>
        <div class="interval">
          <label id="again-label" for="again-minutes"></label>
          <input id="again-minutes" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
          <p id="again-error" class="row-error" hidden></p>
        </div>
      </section>
      <section>
        <h2>目的</h2>
        <ul id="purposes"></ul>
      </section>
      <section>
        <h2>打断选项</h2>
        <form id="option-form">
          <label id="option-add-label" for="option-name">添加打断选项</label>
          <div class="option-add">
            <input id="option-name" type="text" autocomplete="off">
            <button type="submit">添加</button>
          </div>
          <p id="option-add-error" class="row-error" hidden></p>
        </form>
        <ul id="options"></ul>
      </section>
      <section>
        <button id="view-logs" type="button"></button>
      </section>
      <p id="error" hidden></p>
    </main>
    <script src="../shared/constants.js"></script>
    <script src="../shared/time.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
